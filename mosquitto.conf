# Mosquitto MQTT Broker Configuration

# Default listener on port 1883
listener 4000
protocol mqtt

# Allow anonymous connections (no authentication)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

# WebSocket listener (optional, for browser clients)
listener 9001
protocol websockets
