version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kezhia151204
      POSTGRES_DB: sensor_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "4000:4000"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    networks:
      - app-network

  mqtt-server:
    build:
      context: ./mqtt-server
      dockerfile: Dockerfile
    container_name: mqtt-server
    environment:
      - MQTT_BROKER=mqtt://mosquitto:1883
      - DATABASE_URL=postgresql://postgres:kezhia151204@postgres:5432/sensor_db
    depends_on:
      - mosquitto
      - postgres
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./dashboard/aircraft
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      - mqtt-server
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data: